<!DOCTYPE html>
<html>
<head>
<title>SecureCard — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050a14;
  --card: #0c1628;
  --border: #1a2d50;
  --accent: #00d4ff;
  --accent2: #0066ff;
  --danger: #ff4560;
  --text: #e2eaf7;
  --muted: #5a7a9e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'Sora', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--text);
}

/* Animated grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 0;
}

/* Glowing orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  z-index: 0;
  animation: drift 8s ease-in-out infinite alternate;
}
.orb1 { width: 400px; height: 400px; background: var(--accent2); top: -100px; left: -100px; }
.orb2 { width: 300px; height: 300px; background: var(--accent); bottom: -80px; right: -80px; animation-delay: -4s; }

@keyframes drift {
  from { transform: translate(0, 0); }
  to { transform: translate(30px, 20px); }
}

.panel {
  position: relative;
  z-index: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 44px 40px;
  width: 380px;
  box-shadow: 0 0 60px rgba(0,212,255,0.07), 0 30px 60px rgba(0,0,0,0.6);
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}

.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.logo-text {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo-text span { color: var(--accent); }

h2 {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 28px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Sora', sans-serif;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
}

input::placeholder { color: var(--muted); }

.btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Space Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 8px;
}

.btn:hover { opacity: 0.9; }
.btn:active { transform: scale(0.99); }

.alert {
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}

.alert-error { background: rgba(255,69,96,0.1); border: 1px solid rgba(255,69,96,0.3); color: var(--danger); }

.footer-link {
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: var(--muted);
}

.footer-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="panel">
  <div class="logo">
    <div class="logo-icon">💳</div>
    <div class="logo-text">Secure<span>Card</span></div>
  </div>

  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to your fraud detection dashboard</p>

  <div class="field">
    <label>Card Number</label>
    <input type="text" id="card" placeholder="Enter your card number" maxlength="19">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>

  <button class="btn" onclick="login()">→ SIGN IN</button>

  <div class="alert alert-error" id="errMsg"></div>

  <hr class="divider">

  <div class="footer-link">
    Don't have an account? <a href="/register_page">Create one</a>
  </div>
  <div class="footer-link" style="margin-top:10px">
    Admin? <a href="/admin">Open admin panel</a>
  </div>
</div>

<script>
async function login() {
  const card = document.getElementById('card').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errMsg');

  err.style.display = 'none';

  if (!card || !password) {
    err.textContent = 'Please fill in all fields.';
    err.style.display = 'block';
    return;
  }

  const btn = document.querySelector('.btn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;

  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ card_number: card, password })
  });

  const data = await res.json();
  btn.textContent = '→ SIGN IN';
  btn.disabled = false;

  if (data.status === 'success') {
    window.location.href = '/dashboard';
  } else {
    err.textContent = data.message || 'Invalid credentials.';
    err.style.display = 'block';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
